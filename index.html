<!-- Include Protobuf.js CDN in <head> -->
<script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js"></script>

<script>
// Official GTFS-Realtime Minimal Proto Schema
const gtfsProtoSchema = `
syntax = "proto2";
package transit_realtime;

message FeedMessage {
  required FeedHeader header = 1;
  repeated FeedEntity entity = 2;
}

message FeedHeader {
  required string gtfs_realtime_version = 1;
}

message FeedEntity {
  required string id = 1;
  optional VehiclePosition vehicle = 4;
}

message VehiclePosition {
  optional Position position = 2;
  optional TripDescriptor trip = 1;
}

message Position {
  optional float latitude = 1;
  optional float longitude = 2;
  optional float bearing = 3;
}

message TripDescriptor {
  optional string route_id = 5;
}
`;

async function fetchLiveTransLink(apiKey) {
  try {
    // 1. Build request with binary arrayBuffer return
    const targetUrl = `https://gtfsapi.translink.ca/v3/gtfsposition?apikey=${apiKey}`;
    
    // Use raw binary handling proxy (AllOrigins or custom proxy headers)
    const proxyUrl = `https://api.allorigins.win/raw?url=` + encodeURIComponent(targetUrl);

    const response = await fetch(proxyUrl);
    if (!response.ok) throw new Error("HTTP error: " + response.status);

    // CRITICAL: Fetch as ArrayBuffer (binary), NEVER as JSON/Text
    const buffer = await response.arrayBuffer();
    const bytes = new Uint8Array(buffer);

    // 2. Parse schema in browser
    const root = protobuf.parse(gtfsProtoSchema).root;
    const FeedMessage = root.lookupType("transit_realtime.FeedMessage");
    
    // 3. Decode binary payload
    const message = FeedMessage.decode(bytes);
    const feed = FeedMessage.toObject(message, { enums: String, longs: String });

    console.log("Decoded Vehicles:", feed.entity);

    // 4. Extract vehicle markers for Leaflet Map
    const vehicles = [];
    if (feed.entity) {
      feed.entity.forEach(item => {
        if (item.vehicle && item.vehicle.position) {
          vehicles.push({
            id: item.id,
            route: item.vehicle.trip ? item.vehicle.trip.routeId : 'Bus',
            lat: item.vehicle.position.latitude,
            lng: item.vehicle.position.longitude,
            type: 'bus'
          });
        }
      });
    }

    // Render vehicles on Leaflet
    renderVehiclesToMap(vehicles);

  } catch (err) {
    console.error("Browser Protobuf Parsing Error:", err);
  }
}
</script>
